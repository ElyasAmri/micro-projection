[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-projection"
version = "0.1.0"
description = "Fringe projection profilometry for surface measurement"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
viz = [
    "pyvista",
    "matplotlib",
]
dev = [
    "pytest",
]
camera = [
    "opencv-python",
]

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microprojection"
version = "0.1.0"
description = "Control application for the fringe-projection profilometry rig"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
microprojection = "microprojection.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["microprojection"]
known_third_party = ["PySide6"]

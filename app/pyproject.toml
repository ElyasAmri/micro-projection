# The app is run in place from the repo (python app/main.py), not pip-installed,
# so there's no build-system/packaging here -- just metadata and tool config.
[project]
name = "micro-projection-app"
version = "0.1.0"
description = "Control application for the fringe-projection profilometry rig"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
    "numpy>=1.26,<3",
    "opencv-python>=4.8",  # frame I/O for capture + reconstruction
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The rig's FLIR camera. PySpin ships as a platform-specific wheel from
# Teledyne (see .archive/spinnaker_python-*), not PyPI, so install it directly:
#   pip install <spinnaker_python-*.whl>
# The app runs without it (simulation, USB, or synthetic camera); it's only
# needed to drive the real FLIR camera (MP_CAMERA=spinnaker).
hardware = []

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ui", "backend", "maestro"]
known_third_party = ["PySide6", "numpy"]

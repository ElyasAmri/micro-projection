# The app is run in place from the repo (python app/main.py), not pip-installed,
# so there's no build-system/packaging here -- just metadata and tool config.
[project]
name = "micro-projection-app"
version = "0.1.0"
description = "Control application for the fringe-projection profilometry rig"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ui", "backend", "maestro"]
known_third_party = ["PySide6", "numpy"]

# Conda environment for the Fringe Projection project.
#
# Create or update:
#     conda env create -f environment.yml         # first time
#     conda env update -f environment.yml --prune # after pulling changes
#
# Pinned to the versions currently installed in the working environment
# (captured via `pip freeze`) for reproducibility. Loosen tildes/ranges
# once the project stabilizes and CI verifies compatibility.
name: fringe
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Numerics / imaging
  - numpy=2.2.6
  - scipy=1.15.3
  - matplotlib=3.10.9
  - scikit-image=0.25.2
  # Notebook + execution tooling (needed for scripts/build_regression_fixtures.py)
  - nbformat=5.10.4
  - ipykernel=7.2.0
  - jupyterlab=4.5.7
  - notebook=7.5.6
  # Dev / test
  - pytest=9.0.3
  # opencv-python is the pip distribution; conda-forge `opencv` is a different
  # build with different __version__ semantics. Keep on pip to match what is
  # already installed.
  #
  # The Stage 4 GUI stack (PyQt6 + PyQtGraph + PyOpenGL) is also on pip because
  # PyQt6 from PyPI is what is already installed in this env; mixing it with
  # conda-forge's `pyqt`/`pyqt6` builds produces ABI conflicts. Keep all three
  # on pip to match the existing install.
  #
  # Stage 4c lesson: since this env's numpy itself is pip-installed (not
  # conda's numpy), EVERY new dependency goes in the pip block regardless of
  # how pure-Python it looks. Conda's solver doesn't read package source — it
  # reads the dependency graph, and any conda dep that pulls in numpy will
  # install a second, conflicting numpy and a conda-forge BLAS/LAPACK stack
  # over the top of the pip one, breaking `numpy.linalg` at the ABI level.
  # We hit this with `conda install -c conda-forge numpy-stl` (it dragged
  # MKL, libblas, liblapack, etc. in alongside a duplicate numpy build).
  - pip
  - pip:
      - opencv-python==4.13.0.92
      - PyQt6==6.11.0
      - pyqtgraph==0.14.0
      - PyOpenGL==3.1.10
      # STL import (Stage 4c): mesh -> heightmap loader. Pip per the rule
      # above — conda-forge's numpy-stl pulls a conflicting MKL/BLAS stack.
      - numpy-stl==3.2.0
